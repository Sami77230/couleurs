<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Palette — générateur de couleurs</title>
<meta name="description" content="Appuie sur espace pour générer une palette de 5 couleurs harmonieuses. Clique sur un code pour le copier.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎨</text></svg>">
<style>
  :root { --bar: #fff; --bar-text: #1d1d1f; }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    font-family: "Avenir Next", "Segoe UI", system-ui, sans-serif;
    display: flex; flex-direction: column; overflow: hidden;
  }
  #palette { flex: 1; display: flex; min-height: 0; }
  .swatch {
    flex: 1; position: relative; display: flex; flex-direction: column;
    justify-content: flex-end; align-items: center; gap: 14px;
    padding: 0 8px 12vh; transition: background-color .35s ease, color .35s ease;
  }
  .hex {
    font: inherit; font-size: clamp(1rem, 2.2vw, 1.9rem); font-weight: 700;
    letter-spacing: .02em; color: inherit; background: none; border: 0;
    padding: 6px 12px; border-radius: 8px; cursor: pointer;
  }
  .hex:hover { background: rgba(127,127,127,.18); }
  .btns { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  .lock, .copy {
    font: inherit; font-size: .85rem; color: inherit; background: none;
    border: 1.5px solid currentColor; border-radius: 99px; padding: 5px 14px;
    cursor: pointer; opacity: .55;
  }
  .lock:hover, .copy:hover { opacity: 1; }
  .swatch.locked .lock { opacity: 1; background: currentColor; }
  .swatch.locked .lock span { color: var(--bg); }
  button:focus-visible { outline: 3px solid currentColor; outline-offset: 2px; }

  footer {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    flex-wrap: wrap; padding: 12px 20px; background: var(--bar); color: var(--bar-text);
    font-size: .9rem; border-top: 1px solid #0001;
  }
  footer .hint kbd {
    font: inherit; font-weight: 700; border: 1px solid #0003; border-bottom-width: 2px;
    border-radius: 6px; padding: 1px 8px;
  }
  .actions { display: flex; gap: 8px; align-items: center; }
  .mode { opacity: .6; margin-right: 6px; }
  .btn {
    font: inherit; font-weight: 600; border-radius: 8px; padding: 8px 16px;
    cursor: pointer; border: 1.5px solid var(--bar-text); background: none; color: inherit;
  }
  .btn.primary { background: var(--bar-text); color: var(--bar); }

  #toast {
    position: fixed; top: 20px; left: 50%; transform: translate(-50%, -80px);
    background: #1d1d1f; color: #fff; padding: 10px 18px; border-radius: 10px;
    font-weight: 600; transition: transform .25s ease; pointer-events: none;
  }
  #toast.show { transform: translate(-50%, 0); }

  @media (max-width: 640px) {
    #palette { flex-direction: column; }
    .swatch { flex-direction: row; justify-content: space-between; padding: 0 16px; gap: 8px; }
    .hint { display: none; }
    footer { justify-content: center; }
  }
  @media (prefers-reduced-motion: reduce) {
    .swatch, #toast { transition: none; }
  }
</style>
</head>
<body>
  <main id="palette" aria-label="Palette de couleurs"></main>

  <footer>
    <span class="hint"><kbd>Espace</kbd> pour générer une nouvelle palette</span>
    <div class="actions">
      <span class="mode" id="mode"></span>
      <button class="btn" id="copyAll">Copier le CSS</button>
      <button class="btn primary" id="generate">Générer</button>
    </div>
  </footer>

  <div id="toast" role="status" aria-live="polite"></div>

<script>
const COUNT = 5;
const MODES = {
  "Analogue":       [-30, -15, 0, 15, 30],
  "Complémentaire": [0, 12, 180, 192, 0],
  "Triade":         [0, 120, 240, 0, 120],
  "Complément divisé": [0, 150, 210, 0, 180],
  "Monochrome":     [0, 0, 0, 0, 0],
};

const state = { colors: [], locked: Array(COUNT).fill(false), mode: "" };
const $palette = document.getElementById("palette");
const $toast = document.getElementById("toast");
const $mode = document.getElementById("mode");
const $footer = document.querySelector("footer");

/* ---------- Couleurs ---------- */
function hslToHex(h, s, l) {
  h = ((h % 360) + 360) % 360; s /= 100; l /= 100;
  const k = n => (n + h / 30) % 12;
  const a = s * Math.min(l, 1 - l);
  const f = n => l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1)));
  return "#" + [f(0), f(8), f(4)].map(x => Math.round(x * 255).toString(16).padStart(2, "0")).join("");
}
function hexToHue(hex) {
  const r = parseInt(hex.slice(1, 3), 16) / 255, g = parseInt(hex.slice(3, 5), 16) / 255, b = parseInt(hex.slice(5, 7), 16) / 255;
  const max = Math.max(r, g, b), min = Math.min(r, g, b), d = max - min;
  if (!d) return Math.random() * 360;
  let h = max === r ? ((g - b) / d) % 6 : max === g ? (b - r) / d + 2 : (r - g) / d + 4;
  return (h * 60 + 360) % 360;
}
function isDark(hex) {
  const [r, g, b] = [1, 3, 5].map(i => parseInt(hex.slice(i, i + 2), 16));
  return (0.299 * r + 0.587 * g + 0.114 * b) < 150;
}
const rand = (a, b) => a + Math.random() * (b - a);
const shuffle = arr => arr.map(v => [Math.random(), v]).sort((a, b) => a[0] - b[0]).map(x => x[1]);

/* ---------- Génération ---------- */
function generate() {
  const names = Object.keys(MODES);
  state.mode = names[Math.floor(Math.random() * names.length)];
  const lockedIdx = state.locked.findIndex(Boolean);
  const baseHue = lockedIdx >= 0 ? hexToHue(state.colors[lockedIdx]) : rand(0, 360);
  const sat = rand(45, 85);
  const lights = shuffle([20, 36, 54, 72, 90]);
  const offsets = MODES[state.mode];

  state.colors = state.colors.length ? state.colors : Array(COUNT).fill("#ffffff");
  state.colors = state.colors.map((old, i) => {
    if (state.locked[i]) return old;
    const s = state.mode === "Monochrome" ? sat * 0.9 : sat + rand(-12, 12);
    const l = lights[i] + rand(-4, 4);
    return hslToHex(baseHue + offsets[i], Math.max(25, Math.min(95, s)), l);
  });
  render();
  saveToHash();
}

/* ---------- Affichage ---------- */
function render() {
  $palette.innerHTML = "";
  state.colors.forEach((hex, i) => {
    const dark = isDark(hex);
    const el = document.createElement("div");
    el.className = "swatch" + (state.locked[i] ? " locked" : "");
    el.style.backgroundColor = hex;
    el.style.color = dark ? "#fff" : "#111";
    el.style.setProperty("--bg", hex);

    const code = document.createElement("button");
    code.className = "hex";
    code.textContent = hex.toUpperCase();
    code.setAttribute("aria-label", "Copier " + hex);
    code.onclick = () => copy(hex.toUpperCase(), hex.toUpperCase() + " copié");

    const lock = document.createElement("button");
    lock.className = "lock";
    lock.innerHTML = "<span>" + (state.locked[i] ? "Verrouillée" : "Verrouiller") + "</span>";
    lock.setAttribute("aria-pressed", state.locked[i]);
    lock.onclick = () => { state.locked[i] = !state.locked[i]; render(); };

    const copyBtn = document.createElement("button");
    copyBtn.className = "copy";
    copyBtn.textContent = "Copier";
    copyBtn.setAttribute("aria-label", "Copier la couleur " + hex);
    copyBtn.onclick = () => copy(hex.toUpperCase(), hex.toUpperCase() + " copié");

    const btns = document.createElement("div");
    btns.className = "btns";
    btns.append(copyBtn, lock);

    el.append(code, btns);
    $palette.append(el);
  });
  $mode.textContent = state.mode;
  const first = state.colors[0];
  $footer.style.setProperty("--bar", "#fff");
}

/* ---------- Copie ---------- */
async function copy(text, message) {
  try { await navigator.clipboard.writeText(text); toast(message); }
  catch { toast("Copie impossible : sélectionne le code à la main"); }
}
let toastTimer;
function toast(msg) {
  $toast.textContent = msg; $toast.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => $toast.classList.remove("show"), 1600);
}
function cssVars() {
  return ":root {\n" + state.colors.map((c, i) => `  --couleur-${i + 1}: ${c.toUpperCase()};`).join("\n") + "\n}";
}

/* ---------- Lien partageable (#hash) ---------- */
function saveToHash() {
  try { history.replaceState(null, "", "#" + state.colors.map(c => c.slice(1)).join("-")); } catch {}
}
function loadFromHash() {
  const parts = location.hash.slice(1).split("-");
  if (parts.length === COUNT && parts.every(p => /^[0-9a-fA-F]{6}$/.test(p))) {
    state.colors = parts.map(p => "#" + p.toLowerCase());
    state.mode = "Palette partagée";
    render();
    return true;
  }
  return false;
}

/* ---------- Événements ---------- */
document.getElementById("generate").onclick = generate;
document.getElementById("copyAll").onclick = () => copy(cssVars(), "Variables CSS copiées");
document.addEventListener("keydown", e => {
  if (e.code === "Space" && !(e.target instanceof HTMLButtonElement)) { e.preventDefault(); generate(); }
});

if (!loadFromHash()) generate();
</script>
</body>
</html>
